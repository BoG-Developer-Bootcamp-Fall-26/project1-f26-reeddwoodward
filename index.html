<!DOCTYPE html>
<head>
    <Title>PokeDex</Title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="body">
    <h1 class="header1">Bits of Good Mid-Semester Project</h1>
    <div class="container">
        <div class="left">
            <div class="wrapper">
                <div class="sprite"></div>
                <div class="name">Name</div>
                <div class="leftPanel">
                    <h3 class="typeHeader">Types:</h3>
                    <div class="typeContainer">
                        <div class="type">Fire</div>
                        <div class="type">Psychic</div>
                    </div>
                    <div class="arrowContainer">
                        <div class="Arrow">
                            <img src="/Images/chevron-left-icon.png" style="max-height: 70%; width: auto">
                        </div>
                        <div class="Arrow">
                            <img src="/Images/chevron-right-icon.png" style="max-height: 70%; width: auto">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="right">
            <div class="wrapper">
                <div class="sprite"></div>
                <div class="name"></div>
            </div>    
            <div class="leftPanel">
                <h2 class="typeHeader">yo</h2>
            </div>
        </div>
    </div>
</body>
