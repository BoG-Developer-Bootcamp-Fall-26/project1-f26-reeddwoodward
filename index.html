<!DOCTYPE html>
<head>
    <Title>PokeDex</Title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="body">
    <h1 class="header1">Bits of Good Mid-Semester Project</h1>
    <div class="container">
        <div class="left">
            <div class="wrapper">
                <div class="sprite" style="padding: 1em">
                    <img id="sprite" style="height: 100%; width: 100%; image-rendering: pixelated">
                </div>
                <div class="name" id="name">Name</div>
                <div class="leftPanel">
                    <h3 class="typeHeader">Types:</h3>
                    <div class="typeContainer" id="types"></div>
                    <div class="arrowContainer">
                        <div class="Arrow" id="left">
                            <img src="/Images/chevron-left-icon.png" style="max-height: 70%; width: auto">
                        </div>
                        <div class="Arrow" id="right">
                            <img src="/Images/chevron-right-icon.png" style="max-height: 70%; width: auto">
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="right">
             <h1 class="header2">Info</h1>
             <div class="description" id="description">hrtdjtykuyfio/tiypuyflukdtyfxcghjv.hlguifyktdgchugyfkutdj,g.uofiykutcgjhlvfcgkjhmcjkgjkhvkv</div>
             <div class="buttonContainer">
                <div class="button" id="info">Info</div>
                <div class="button" id="moves">Moves</div>
             </div>
        </div>
    </div>

    <script src="PokeDex.js"></script>
</body>
